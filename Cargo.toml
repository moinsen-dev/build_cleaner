[package]
name = "build-cleaner"
version = "0.2.0"
edition = "2021"
description = "Multi-language build directory cleaner - reclaim disk space by removing build artifacts"
license = "MIT OR Apache-2.0"
repository = "https://github.com/moinsen/build_cleaner"
keywords = ["cli", "cleaner", "build", "disk-space", "developer-tools"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
# CLI parsing
clap = { version = "4.4", features = ["derive", "color"] }

# Filesystem traversal
walkdir = "2.4"

# Parallelism
rayon = "1.8"

# Console output
colored = "2.1"
indicatif = { version = "0.17", features = ["rayon"] }

# Interactive prompts
dialoguer = { version = "0.11", features = ["fuzzy-select"] }

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Human-readable sizes
bytesize = "1.3"

# Time handling for --min-age
chrono = "0.4"

# Home directory detection
dirs = "5.0"

# Web UI server
axum = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
tokio-stream = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rust-embed = "8"
tower-http = { version = "0.5", features = ["cors"] }
mime_guess = "2"
open = "5"
async-stream = "0.3"
futures = "0.3"

[dev-dependencies]
tempfile = "3.23"

[profile.release]
lto = true
codegen-units = 1
strip = true
