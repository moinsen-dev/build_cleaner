name: Release

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always
  BINARY_NAME: build-cleaner

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-apple-darwin
            os: macos-latest
            artifact_name: build-cleaner-x86_64-apple-darwin
          - target: aarch64-apple-darwin
            os: macos-latest
            artifact_name: build-cleaner-aarch64-apple-darwin
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            artifact_name: build-cleaner-x86_64-unknown-linux-gnu
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            artifact_name: build-cleaner-aarch64-unknown-linux-gnu

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-compilation tools (Linux ARM)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Build
        run: |
          if [ "${{ matrix.target }}" = "aarch64-unknown-linux-gnu" ]; then
            export CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc
          fi
          cargo build --release --target ${{ matrix.target }}

      - name: Package
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/${{ env.BINARY_NAME }} dist/
          cd dist
          tar -czvf ${{ matrix.artifact_name }}.tar.gz ${{ env.BINARY_NAME }}
          shasum -a 256 ${{ matrix.artifact_name }}.tar.gz > ${{ matrix.artifact_name }}.tar.gz.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            dist/${{ matrix.artifact_name }}.tar.gz
            dist/${{ matrix.artifact_name }}.tar.gz.sha256

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release assets
        run: |
          mkdir -p release
          find artifacts -name "*.tar.gz" -exec cp {} release/ \;
          find artifacts -name "*.sha256" -exec cp {} release/ \;

          # Create combined checksums file
          cd release
          cat *.sha256 > checksums.txt

      - name: Get version
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: v${{ steps.version.outputs.version }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            release/*.tar.gz
            release/checksums.txt

      - name: Generate Homebrew formula
        id: formula
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # Get SHA256 checksums
          SHA_MACOS_ARM=$(cat release/build-cleaner-aarch64-apple-darwin.tar.gz.sha256 | awk '{print $1}')
          SHA_MACOS_INTEL=$(cat release/build-cleaner-x86_64-apple-darwin.tar.gz.sha256 | awk '{print $1}')
          SHA_LINUX_ARM=$(cat release/build-cleaner-aarch64-unknown-linux-gnu.tar.gz.sha256 | awk '{print $1}')
          SHA_LINUX_INTEL=$(cat release/build-cleaner-x86_64-unknown-linux-gnu.tar.gz.sha256 | awk '{print $1}')

          cat > build-cleaner.rb << EOF
          class BuildCleaner < Formula
            desc "Clean build artifacts and caches across multiple ecosystems"
            homepage "https://github.com/moinsen-dev/build_cleaner"
            version "${VERSION}"
            license "MIT"

            on_macos do
              on_arm do
                url "https://github.com/moinsen-dev/build_cleaner/releases/download/v${VERSION}/build-cleaner-aarch64-apple-darwin.tar.gz"
                sha256 "${SHA_MACOS_ARM}"
              end
              on_intel do
                url "https://github.com/moinsen-dev/build_cleaner/releases/download/v${VERSION}/build-cleaner-x86_64-apple-darwin.tar.gz"
                sha256 "${SHA_MACOS_INTEL}"
              end
            end

            on_linux do
              on_arm do
                url "https://github.com/moinsen-dev/build_cleaner/releases/download/v${VERSION}/build-cleaner-aarch64-unknown-linux-gnu.tar.gz"
                sha256 "${SHA_LINUX_ARM}"
              end
              on_intel do
                url "https://github.com/moinsen-dev/build_cleaner/releases/download/v${VERSION}/build-cleaner-x86_64-unknown-linux-gnu.tar.gz"
                sha256 "${SHA_LINUX_INTEL}"
              end
            end

            def install
              bin.install "build-cleaner"
            end

            test do
              system "#{bin}/build-cleaner", "--version"
            end
          end
          EOF

      - name: Update Homebrew tap
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git clone "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/moinsen-dev/homebrew-tap.git" tap
          cp build-cleaner.rb tap/Formula/
          cd tap
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add Formula/build-cleaner.rb
          git commit -m "Update build-cleaner to v${VERSION}"
          git push
