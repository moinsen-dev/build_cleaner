# Site settings
title: Build Cleaner
description: A fast, safe CLI tool to recursively find and delete build artifacts and caches across multiple programming ecosystems
baseurl: "/build_cleaner"
url: "https://moinsen-dev.github.io"

# Repository info
repository: moinsen-dev/build_cleaner
github_username: moinsen-dev

# Theme settings
remote_theme: pages-themes/cayman@v0.2.0
plugins:
  - jekyll-remote-theme
  - jekyll-seo-tag

# Build settings
markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: highlight

# Exclude from processing
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor

# Collections for documentation pages
collections:
  docs:
    output: true
    permalink: /:path/

# Default front matter
defaults:
  - scope:
      path: ""
      type: "docs"
    values:
      layout: "default"
  - scope:
      path: ""
    values:
      layout: "default"

# Navigation
navigation:
  - title: Home
    url: /
  - title: Installation
    url: /installation/
  - title: Usage
    url: /usage/
  - title: Web UI
    url: /web-ui/
  - title: Ecosystems
    url: /ecosystems/
  - title: User Caches
    url: /caches/
  - title: Script Generation
    url: /scripts/
  - title: Safety
    url: /safety/
